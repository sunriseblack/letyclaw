services:
  letyclaw:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Container paths must win over local-friendly values in .env.example.
      VAULT_PATH: /data/vault
      SESSIONS_DIR: /data/sessions
      LETYCLAW_PROJECT_ROOT: /app
    volumes:
      - ./vault:/data/vault
      # Generate these reviewed artifacts before `docker compose up` (README).
      - ./agents/unified/CLAUDE.md:/data/vault/CLAUDE.md:ro
      - ./agents/unified/domains:/data/vault/.letyclaw/domains:ro
      - ./sessions:/data/sessions
      - ./logs:/app/logs
      # cron tools update cron.yaml, so config is intentionally read/write.
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
