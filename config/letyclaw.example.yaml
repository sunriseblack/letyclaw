# letyclaw config — copy to letyclaw.yaml and customize
bot:
  name: "Letyclaw"
  owner: "Owner"
  timezone: "UTC"

agents:
  defaults:
    maxTurns: 10
    session:
      ttlHours: 24
      pruneAfterDays: 30
    timeouts:
      claudeTotal: 1200000
      # A run still working at claudeTotal may be resumed with a fresh budget.
      claudeMaxContinuations: 2
    rateLimit:
      maxRequests: 10
      windowMs: 60000

  list:
    - id: personal
      name: "Personal"
      maxTurns: 50
      # Credential/service-dependent toolsets are opt-in. Remove a name only
      # after configuring that integration for this runtime.
      disabledToolsets: [browser, connectors, gdrive, gmail, media, ticktick, voice]

    - id: work
      name: "Work"
      maxTurns: 50
      # Optional progressive skills and per-agent tool visibility controls:
      # skills: ["your-skill-name"]
      # enabledToolsets: ["memory", "sessions", "skills"]
      disabledToolsets: [browser, connectors, gdrive, gmail, media, ticktick, voice]
      # disabledTools: ["ticktick_delete_task"]

    - id: health
      name: "Health"
      maxTurns: 10
      disabledToolsets: [browser, connectors, gdrive, gmail, media, ticktick, voice]

    - id: finance
      name: "Finance"
      maxTurns: 10
      disabledToolsets: [browser, connectors, gdrive, gmail, media, ticktick, voice]

channels:
  telegram:
    token:
      secretRef: telegram_bot_token
    chatId: YOUR_GROUP_ID_HERE
    accounts:
      - id: main
        allowFrom:
          - YOUR_USER_ID_HERE
    routing:
      - agent: personal
        threadId: 2
      - agent: work
        threadId: 3
      - agent: health
        threadId: 4
      - agent: finance
        threadId: 5
