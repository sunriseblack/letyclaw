# Install as /etc/nginx/conf.d/letyclaw-health-webhook-rate-limit.conf.
#
# This directive belongs in nginx's `http` context. Ubuntu's stock nginx.conf
# includes /etc/nginx/conf.d/*.conf there, before sites-enabled/*.
# A generous mobile-friendly ceiling still absorbs automated spray against the
# one Apple Shortcut endpoint.
limit_req_zone $binary_remote_addr zone=letyclaw_health_webhook:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=letyclaw_vapi_webhook:10m rate=120r/m;
