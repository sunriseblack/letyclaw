# Include this file inside the deployment's existing TLS server block only.
# The upstream must remain loopback-only after the two-phase migration in
# docs/health-webhook-ingress.md is complete.
location = /health/apple {
    limit_except POST { deny all; }

    limit_req zone=letyclaw_health_webhook burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 5m;

    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_request_buffering on;

    add_header Cache-Control "no-store" always;
}

location = /voice/vapi {
    limit_except POST { deny all; }

    limit_req zone=letyclaw_vapi_webhook burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;

    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 20s;
    proxy_request_buffering on;

    add_header Cache-Control "no-store" always;
}
