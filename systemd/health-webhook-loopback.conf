# Install as /etc/systemd/system/health-webhook.service.d/loopback.conf only
# after a real iPhone Shortcut request succeeds through nginx over HTTPS.
[Service]
Environment=HEALTH_WEBHOOK_HOST=127.0.0.1

# The webhook has no reason to initiate or accept non-loopback network traffic
# once nginx is its only ingress. These directives are defense in depth; UFW
# port 8788 must also be closed during the same cutover.
IPAddressDeny=any
IPAddressAllow=localhost
